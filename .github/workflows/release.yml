name: Release

on:
  push:
    tags:
      - 'lkapi-v*'
  workflow_dispatch:

env:
  RELEASE_BODY: >-
    Windows 下载 -setup.exe（安装版，支持应用内自动更新）。
    0.4.2 新增：链路可观测（路由地图 / Prompt 分段 / 首字耗时 / 重试详情）、Qoder 账号、Wiki 采集与 PDF OCR、用量统计与日志清理解耦。
    0.4.1 起升级保留数据：渠道 / 密钥 / 日志 / 知识库 / Wiki 自动沿用，迁移 046-052 自动补齐。
    升级前会自动生成 lkapi.db.pre-upgrade-* 备份（最多保留 3 份）；迁移失败时原库以 lkapi.db.broken-* 隔离保留。

jobs:
  # Windows 先跑：创建 draft release，完成版本一致性校验，并产出 latest.json 的 windows 条目
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 与本地 pnpm 大版本保持一致，避免本地/CI 写出不同格式的 lock
      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: verify versions (package.json / tauri.conf.json / Cargo.toml / tag)
        shell: bash
        run: |
          set -euo pipefail
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tauri.conf.json=$CONF  package.json=$PKG  Cargo.toml=$CARGO  ref=${GITHUB_REF_NAME:-none}"
          if [ "$CONF" != "$PKG" ] || [ "$CONF" != "$CARGO" ]; then
            echo "::error::版本号不一致（tauri.conf.json=$CONF package.json=$PKG Cargo.toml=$CARGO），先用 node scripts/set-version.mjs <版本> 统一"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGVER="${GITHUB_REF_NAME#lkapi-v}"
            if [ "$TAGVER" != "$CONF" ]; then
              echo "::error::tag 是 $TAGVER，但 tauri.conf.json 是 $CONF，先改版本号再打 tag"
              exit 1
            fi
          fi
          cd src-tauri
          cargo metadata --locked --format-version 1 > /dev/null

      - name: verify updater signing key matches pubkey
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少仓库 secret TAURI_SIGNING_PRIVATE_KEY，构建出的安装包没有 .sig，应用内自动更新会直接失效"
            exit 1
          fi
          node scripts/verify-updater-key.mjs

      # pdfium 动态库（知识库 PDF OCR 渲染依赖）不随源码入库：打包前下载到
      # src-tauri/resources/pdfium/，tauri.conf.json 的 bundle.resources 会自动打进安装包。
      - name: fetch pdfium
        shell: bash
        run: bash scripts/fetch-pdfium.sh

      - name: build Tauri app (windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 手动触发（workflow_dispatch）只做构建校验，不创建 release/不占用 tag；
          # 打 tag 触发时才真正出包并上传到 draft release。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'lkapi-v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'LKAPI v__VERSION__' || '' }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          # Windows 的更新包必须指向 NSIS 的 setup.exe，否则 latest.json 的 windows 条目会指向 msi
          updaterJsonPreferNsis: true
          args: '--bundles nsis'

  # Linux 串行在 Windows 之后：避免两个 job 同时读改写同一个 latest.json
  linux:
    needs: windows
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # 同 Windows：OCR 依赖的 pdfium 动态库在打包前拉取
      - name: fetch pdfium
        run: bash scripts/fetch-pdfium.sh

      - name: build Tauri app (linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'lkapi-v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'LKAPI v__VERSION__' || '' }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: '--bundles deb,appimage,rpm'

  # 把 draft 转正：应用内自动更新的 endpoints 指向 releases/latest/download/latest.json，
  # 而 /releases/latest 不解析 draft —— 不转正的话客户端永远检查不到新版本。
  publish:
    needs: [windows, linux]
    # workflow_dispatch 只做构建校验，不碰 release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: publish release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="lkapi-v${VERSION}"
          echo "目标 tag: $TAG"

          # 版本守卫：新旧版本号不得倒退，防止重发旧 tag 抢走 latest 标记。
          LATEST_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$LATEST_TAG" ]; then
            LATEST_VERSION="${LATEST_TAG#lkapi-v}"
            if ! node -e '
              const toNum = (v) => v.split("-")[0].split(".").map((n) => Number(n) || 0);
              const a = toNum(process.argv[1]);
              const b = toNum(process.argv[2]);
              for (let i = 0; i < 3; i += 1) {
                if ((a[i] || 0) !== (b[i] || 0)) process.exit((a[i] || 0) < (b[i] || 0) ? 1 : 0);
              }
            ' "$VERSION" "$LATEST_VERSION"; then
              echo "::error::版本 $VERSION 低于当前 latest 版本 $LATEST_VERSION（$LATEST_TAG），拒绝发布。检查 tag 是否打错，或先发布更高版本。"
              exit 1
            fi
            echo "版本守卫通过：$VERSION >= $LATEST_VERSION（当前 latest）"
          fi

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > tag.json 2>/dev/null; then
            echo "::error::找不到 $TAG 对应的 release，检查构建 job 是否成功"
            exit 1
          fi
          DRAFT=$(node -p "require('./tag.json').isDraft")
          if [ "$DRAFT" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            echo "已发布 $TAG 并设为 latest"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
            echo "$TAG 已是正式 release，已设为 latest"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s).assets.map(x=>x.name);if(!a.includes('latest.json')){console.error('release 缺少 latest.json，应用内自动更新会失效');process.exit(1);}if(!a.some(x=>x.endsWith('.sig'))){console.error('release 缺少 .sig 签名文件，自动更新会因验签失败被拒绝');process.exit(1);}console.log('latest.json +',a.filter(x=>x.endsWith('.sig')).length,'个签名文件，自动更新链路完整')})"
